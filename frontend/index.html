<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Perf: warm up the origins the hero LCP image + webfonts come from, and
         preload the hero image so it is discoverable from the initial HTML
         instead of waiting for React to render. href must byte-match the URL
         OptimizedImage builds for the Home hero (w=1600 & q=80). -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1600&q=80&auto=format&fm=webp"
    />

    <!-- Primary SEO -->
    <title>TripNow — AI Travel Planner | Personalized Itineraries in Seconds</title>
    <meta name="description" content="TripNow builds personalized, day-by-day travel itineraries in seconds using AI — with budgets, food picks, hotels, and local tips for any destination." />
    <meta name="keywords" content="AI travel planner, trip itinerary generator, travel planning, vacation planner, day by day itinerary" />
    <meta name="author" content="Abhishek Kasaudhan" />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="canonical" href="https://tripnow.abhishektech.me/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TripNow" />
    <meta property="og:title" content="TripNow — AI Travel Planner" />
    <meta property="og:description" content="Plan your dream trip in seconds — AI-crafted itineraries, budget breakdowns, food & hotel picks." />
    <meta property="og:url" content="https://tripnow.abhishektech.me/" />
    <meta property="og:image" content="https://tripnow.abhishektech.me/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TripNow — AI Travel Planner" />
    <meta name="twitter:description" content="Plan your dream trip in seconds — AI-crafted itineraries, budgets, food & hotel picks." />
    <meta name="twitter:image" content="https://tripnow.abhishektech.me/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
