<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="fav-pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="fav-orbit-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="55%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="fav-arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Concept 06: Map Pin Silhouette with Center Aperture -->
  <path
    d="M 13.5 5 C 9.63 5 6.5 8.13 6.5 12 C 6.5 17.2 13.5 25 13.5 25 C 13.5 25 20.5 17.2 20.5 12 C 20.5 8.13 17.37 5 13.5 5 Z M 13.5 9.5 A 2.5 2.5 0 1 0 13.5 14.5 A 2.5 2.5 0 1 0 13.5 9.5 Z"
    fill="url(#fav-pin-grad)"
    fill-rule="evenodd"
  />

  <!-- Concept 06: Golden Orbital Launch Curve -->
  <path
    d="M 5 19.5 C 6.5 25 10 27.5 14.5 27.5 C 19.8 27.5 24.5 22.8 25 14.5 C 25.3 11 24.2 8.5 22.8 6.5"
    stroke="url(#fav-orbit-grad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Concept 06: Launch Arrowhead pointing Northeast -->
  <path
    d="M 28.5 3.5 L 22.5 5 L 24.8 7.3 L 26.2 9.5 Z"
    fill="url(#fav-arrow-grad)"
  />
</svg>
